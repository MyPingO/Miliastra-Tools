(()=>{
  document.title='Miliastra Tools · Data Editor';
  const brand=document.querySelector('.brand');
  if(brand)brand.textContent='Miliastra Tools';
  const notice=document.querySelector('.notice');
  if(notice)notice.innerHTML='<strong>Local processing.</strong> Files stay in your browser. Nothing is uploaded.';
  const open=document.getElementById('openButton');
  if(open)open.textContent='Open';
  const buildTitle=document.querySelector('.build-title p');
  if(buildTitle)buildTitle.textContent='Start from a validated template or native schema, then edit immediately.';

  document.querySelectorAll('.build-card').forEach(card=>{
    const button=card.querySelector('button');
    if(button){
      button.textContent=button.textContent.replace(' GIA','').replace(' JSON','');
      card.setAttribute('tabindex','0');
      card.setAttribute('role','button');
      const activate=event=>{
        if(event.target.closest('button,input,select,textarea,a'))return;
        button.click();
      };
      card.addEventListener('click',activate);
      card.addEventListener('keydown',event=>{
        if(event.key==='Enter'||event.key===' '){event.preventDefault();button.click();}
      });
    }
  });

  const inspector=document.querySelector('.inspector');
  const original={
    add:document.getElementById('addButton'),
    duplicate:document.getElementById('duplicateButton'),
    up:document.getElementById('upButton'),
    down:document.getElementById('downButton'),
    del:document.getElementById('deleteButton')
  };
  if(inspector&&original.add){
    const dock=document.createElement('div');
    dock.className='quick-dock empty';
    dock.innerHTML="<div class='quick-dock-row'><span class='quick-label'>Selected item</span><button class='quick-add' data-action='add'>+ Add after</button><button data-action='duplicate'>Duplicate</button><span class='dock-sep'></span><button data-action='up' title='Move up'>↑</button><button data-action='down' title='Move down'>↓</button><button class='quick-delete' data-action='del'>Delete</button></div><div class='quick-dock-hints'><span><kbd>Enter</kbd> edit name</span><span><kbd>Ctrl D</kbd> duplicate</span><span><kbd>Alt ↑↓</kbd> move</span><span><kbd>Del</kbd> delete</span></div>";
    inspector.prepend(dock);
    const buttons={};
    dock.querySelectorAll('[data-action]').forEach(button=>{
      const action=button.dataset.action;
      buttons[action]=button;
      button.addEventListener('click',()=>original[action]?.click());
    });
    const syncDock=()=>{
      const selected=!!document.querySelector('tbody tr.selected');
      dock.classList.toggle('empty',!selected);
      Object.entries(buttons).forEach(([action,button])=>{
        const src=original[action];
        button.disabled=!src||src.disabled;
      });
    };
    const observer=new MutationObserver(syncDock);
    Object.values(original).filter(Boolean).forEach(button=>observer.observe(button,{attributes:true,attributeFilter:['disabled']}));
    ['singleBody','deckBody','structureBody'].forEach(id=>{
      const body=document.getElementById(id);
      if(body)observer.observe(body,{subtree:true,attributes:true,childList:true,attributeFilter:['class']});
    });
    syncDock();
  }

  const topbar=document.querySelector('.topbar');
  if(topbar){
    const density=document.createElement('button');
    density.className='density-button';
    density.type='button';
    const syncDensity=()=>{
      const compact=localStorage.getItem('miliastra-density')!=='comfortable';
      document.body.classList.toggle('compact-mode',compact);
      density.textContent=compact?'Compact':'Comfortable';
      density.title='Toggle editor density';
    };
    density.addEventListener('click',()=>{
      const compact=document.body.classList.contains('compact-mode');
      localStorage.setItem('miliastra-density',compact?'comfortable':'compact');
      syncDensity();
    });
    syncDensity();

    const shortcuts=document.createElement('button');
    shortcuts.className='shortcut-button';
    shortcuts.type='button';
    shortcuts.textContent='?';
    shortcuts.title='Keyboard shortcuts';
    const exportButton=document.getElementById('exportButton');
    if(exportButton){exportButton.insertAdjacentElement('afterend',shortcuts);shortcuts.insertAdjacentElement('afterend',density);}else{topbar.append(shortcuts,density);}
    const panel=document.createElement('div');
    panel.className='shortcut-panel hidden';
    panel.innerHTML='<div class="shortcut-card"><div class="shortcut-head"><strong>Keyboard shortcuts</strong><button data-close>Close</button></div><div class="shortcut-grid"><div class="shortcut-section"><h3>File & history</h3><div class="shortcut-row"><span>Open file</span><span><kbd>Ctrl O</kbd></span></div><div class="shortcut-row"><span>Export</span><span><kbd>Ctrl S</kbd></span></div><div class="shortcut-row"><span>Build New</span><span><kbd>Ctrl N</kbd></span></div><div class="shortcut-row"><span>Undo / Redo</span><span><kbd>Ctrl Z</kbd> / <kbd>Ctrl Y</kbd></span></div><div class="shortcut-row"><span>Filter</span><span><kbd>Ctrl F</kbd></span></div></div><div class="shortcut-section"><h3>Items</h3><div class="shortcut-row"><span>Add</span><span><kbd>Insert</kbd></span></div><div class="shortcut-row"><span>Edit primary field</span><span><kbd>Enter</kbd></span></div><div class="shortcut-row"><span>Duplicate</span><span><kbd>Ctrl D</kbd></span></div><div class="shortcut-row"><span>Copy / Paste</span><span><kbd>Ctrl C</kbd> / <kbd>Ctrl V</kbd></span></div><div class="shortcut-row"><span>Select previous / next</span><span><kbd>↑</kbd> / <kbd>↓</kbd></span></div><div class="shortcut-row"><span>Move previous / next</span><span><kbd>Alt ↑</kbd> / <kbd>Alt ↓</kbd></span></div><div class="shortcut-row"><span>Delete</span><span><kbd>Del</kbd></span></div></div></div></div>';
    document.body.append(panel);
    const setPanel=open=>panel.classList.toggle('hidden',!open);
    shortcuts.addEventListener('click',()=>setPanel(true));
    panel.querySelector('[data-close]').addEventListener('click',()=>setPanel(false));
    panel.addEventListener('click',event=>{if(event.target===panel)setPanel(false);});
    document.addEventListener('keydown',event=>{
      if(event.key==='?'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){event.preventDefault();setPanel(true);}
      if(event.key==='Escape'&&!panel.classList.contains('hidden')){event.preventDefault();event.stopImmediatePropagation();setPanel(false);}
    },true);
  }
})();
