<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><meta name="description" content="Fast, local-only editor and builder for Miliastra GIA and variable export files."><link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><title>Miliastra Tools · Data Editor</title><style>html,body,#app{width:100%;height:100%;margin:0;background:#090d16}#app{border:0;display:block}.boot{position:fixed;inset:0;display:grid;place-items:center;color:#93a4bb;font:14px system-ui;background:#090d16}.boot strong{color:#f4f7fb}</style></head><body><div class="boot" id="boot"><div><strong>Miliastra Tools</strong><br>Loading editor…</div></div><iframe id="app" title="Miliastra Tools editor"></iframe><script>(async()=>{try{const [sourceRes,cssRes,jsRes]=await Promise.all([fetch('https://raw.githubusercontent.com/MyPingO/Miliastra-Tools/14b43989be0c9954d72718a1ff530412e1b34c87/index.html'),fetch('./assets/site.css'),fetch('./assets/site.js')]);if(!sourceRes.ok||!cssRes.ok||!jsRes.ok)throw new Error('Failed to load editor assets');let source=await sourceRes.text();const css=await cssRes.text();const js=await jsRes.text();source=source.replace('</style>','\n'+css+'\n</style>');source=source.replace('</body>','<script>'+js.replace(/<\/script/gi,'<\\/script')+'<\/script></body>');const frame=document.getElementById('app');frame.addEventListener('load',()=>document.getElementById('boot')?.remove(),{once:true});frame.srcdoc=source}catch(error){console.error(error);document.getElementById('boot').innerHTML='<div><strong>Editor failed to load.</strong><br>Refresh the page to try again.</div>'}})();</script></body></html>
